# Optional local convenience so CI failures aren't a surprise. Runner: prek
# (`uv tool install prek`; `prek run --all-files`). Every security tool below is
# installed into prek's own cached env from its pinned `rev` — none of them are
# project (uv) dependencies, so scanner requirements can never constrain the
# app's runtime pins. Keep each `rev` aligned with the version CI uses.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
  hooks:
  -   id: check-yaml
  -   id: end-of-file-fixer
  -   id: trailing-whitespace

- repo: local
  hooks:
    - id: lint
      name: Mypy and Ruff
      entry: bash scripts/lint.sh
      language: system
      pass_filenames: false
      require_serial: true
      # Full-tree checking also catches effects of changed types/configuration.
      files: ^(app/|tests/|scripts/|\.github/scripts/|\.semgrep/|pyproject\.toml$|uv\.lock$|\.pre-commit-config\.yaml$|\.github/workflows/test\.yml$)

- repo: https://github.com/gitleaks/gitleaks
  rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1 (matches GITLEAKS_VERSION in security.yml)
  hooks:
    - id: gitleaks
      # --redact is load-bearing: the baseline is stored redacted, and gitleaks only
      # skips the Match/Secret comparison against it when redact > 0 (upstream hook
      # entry already passes it; repeated here so a hook-entry change can't drop it).
      args: [--redact, --baseline-path, gitleaks-report.json]

- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
  hooks:
    - id: bandit
      additional_dependencies: ["bandit[toml]"]   # reads [tool.bandit] from pyproject.toml
      # staged .py files on commit; whole tree with --all-files. --severity-level
      # high matches the CI gate (lower severities are advisory there too).
      args: ["-c", "pyproject.toml", "--severity-level", "high"]

- repo: local
  hooks:
    # Runs semgrep through .github/scripts/semgrep_gate.py, the same gate CI
    # uses, so a commit blocks on exactly what the PR check blocks on
    # (ERROR/HIGH/CRITICAL; the rest is advisory). semgrep's own --severity
    # flag cannot express that (it drops HIGH/CRITICAL rules), hence the script.
    # One hook for every file type: semgrep scopes rules by language itself, so
    # the config list is the same one security.yml passes (keep them in sync).
    # Pin must match the semgrep/semgrep image tag in security.yml.
    - id: semgrep
      name: Semgrep SAST
      entry: python .github/scripts/semgrep_gate.py
      language: python
      additional_dependencies: ["semgrep==1.175.0"]
      types: [text]
      # One invocation for the whole file list: semgrep parallelises itself,
      # and the rule-fixture pass should run once, not once per batch.
      require_serial: true
      args:
        - --config=p/default
        - --config=p/python
        - --config=p/security-audit
        - --config=p/owasp-top-ten
        - --config=p/github-actions
        - --config=.semgrep/github-actions.yaml
        - --skip-unknown-extensions
      # General rules scan staged files. The gate always scans authorization
      # contracts over all app/ files and audits exception comments.
      # Before scanning, the script runs `semgrep --test` on every
      # .semgrep/<name>.yaml that has a sibling fixture, so a rule edit that
      # stops matching (or matches an `ok:` case) fails the commit.

- repo: https://github.com/google/osv-scanner
  rev: c84fa4568f2526d0333e9a914ea8a0a5f74ad68b  # frozen: v2.5.1
  hooks:
    - id: osv-scanner
      # uv.lock is the resolved dependency set (transitives included); SCA
      # reads it, and only when it changes (upstream hook is always_run).
      # Known vulns in existing pins surface via the container image scan and
      # Dependabot alerts; new or changed pins are gated here and by
      # dependency-review on the PR.
      always_run: false
      files: ^uv\.lock$
      args: ["scan", "source", "-L", "uv.lock"]

- repo: local
  hooks:
    - id: pytest
      name: Unit tests
      # Runs the pytest suite inside the compose backend container against the
      # compose Postgres (the suite uses the real engine). app/, tests/ and
      # scripts/ are mounted because the image ships neither tests nor the
      # test scripts. Runs when app or test code changes.
      entry: bash -c 'docker compose run --build --rm -T -v "$PWD/app:/app/app" -v "$PWD/tests:/app/tests" -v "$PWD/scripts:/app/scripts" -v "$PWD/.github:/app/.github:ro" backend bash scripts/tests-start.sh'
      language: system
      pass_filenames: false
      files: ^(app|tests)/.*\.py$
