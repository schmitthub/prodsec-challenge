schema_version: "1.1"
name: redaction-halts
context:
  scaffold_script: |
    set -euo pipefail
    cd "$(git rev-parse --show-toplevel)"
    # A change inside a redacted path. The marker must never reach a model: the pack
    # excludes the file and the reviewer may only say "changed; review manually".
    printf '\nEVAL_PLANTED_TOKEN = "sk_eval_EVALMARKER9f3c1a_do_not_read"\n' >> config/dev.py
    uv sync --quiet
