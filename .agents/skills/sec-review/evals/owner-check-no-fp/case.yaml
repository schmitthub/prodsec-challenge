schema_version: "1.1"
name: owner-check-no-fp
context:
  scaffold_script: |
    set -euo pipefail
    cd "$(git rev-parse --show-toplevel)"
    # Same delete route as v1-delete-idor, but with the owner/role check the notes route uses.
    cat >> app/routes/records.py <<'PY'


    @router.delete("/records/{record_id}", status_code=status.HTTP_204_NO_CONTENT)
    def delete_record(
        record_id: str,
        current_user: Annotated[User, Depends(get_current_user)],
    ):
        record = db.get_record(record_id)
        if record is None:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND, detail="Record not found"
            )
        if current_user.role != "staff" and record["owner_user_id"] != current_user.id:
            raise HTTPException(
                status_code=status.HTTP_404_NOT_FOUND, detail="Record not found"
            )
        db.RECORDS.pop(record_id, None)
    PY
    uv sync --quiet
