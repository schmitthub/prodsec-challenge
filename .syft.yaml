# syft config for the records-api release SBOM (used by .github/workflows/build.yml).
# Image SBOMs are generated from the docker-archive produced by `docker save`;
# default catalogers cover Debian dpkg + Python (pip/dist-info) packages.
exclude:
  - "./.venv/**"
  - "./dist/**"
  - "./.serena/**"
  - "./.claude/**"

file:
  metadata:
    selection: "owned-by-package"

source:
  name: "records-api"
