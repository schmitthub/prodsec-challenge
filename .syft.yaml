# syft config for the records-api release SBOM (used by .github/workflows/build.yml).
# The release SBOM is generated from the source tree at the tag: default
# catalogers pick up uv.lock / requirements.txt and the pinned GitHub Actions.
exclude:
  - "./.venv/**"
  - "./release-subjects/**"
  - "./.serena/**"
  - "./.claude/**"

file:
  metadata:
    selection: "owned-by-package"

source:
  name: "records-api"
