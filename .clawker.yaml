# yaml-language-server: $schema=https://raw.githubusercontent.com/schmitthub/clawker/v2026.8.5/docs/schemas/clawker.schema.json
agent:
  env:
    # python stack presets a root-owned sticky dir; uv cannot rewrite minor-version symlinks there as the agent user.
    # Per-user dir lets `uv python install` / `uv sync` / `uvx -p X` fetch interpreters on demand. See schmitthub/clawker#506.
    UV_PYTHON_INSTALL_DIR: /home/clawker/.local/share/uv/python
  from_env:
    - GH_TOKEN
    - CONTEXT7_API_KEY
    - TERM_PROGRAM
    - TERM_PROGRAM_VERSION
harnesses:
  claude:
    post_init: |
      claude mcp add -s local serena -- uvx --from git+https://github.com/oraios/serena@949a27ef1e5fda1a6e7b561e777bcece345c6ffd serena start-mcp-server --context claude-code --project "$(pwd)" --enable-web-dashboard false
      claude mcp add -s local -t http deepwiki https://mcp.deepwiki.com/mcp
      claude mcp add --scope local context7 -- npx -y @upstash/context7-mcp --api-key "$CONTEXT7_API_KEY"
  codex:
    post_init: |
      uvx --from git+https://github.com/oraios/serena@949a27ef1e5fda1a6e7b561e777bcece345c6ffd serena setup codex
      codex mcp add serena --enable codex_hooks --env PATH="$PATH" --env SSL_CERT_FILE="$SSL_CERT_FILE" --env CURL_CA_BUNDLE="$CURL_CA_BUNDLE" --env NODE_USE_SYSTEM_CA=1 -- uvx --from git+https://github.com/oraios/serena@949a27ef1e5fda1a6e7b561e777bcece345c6ffd serena start-mcp-server --context=codex --project-from-cwd --enable-web-dashboard false
      codex mcp add deepwiki --url https://mcp.deepwiki.com/mcp
      codex mcp add context7 --env PATH="$PATH" --env SSL_CERT_FILE="$SSL_CERT_FILE" --env CURL_CA_BUNDLE="$CURL_CA_BUNDLE" --env NODE_USE_SYSTEM_CA=1 -- npx -y @upstash/context7-mcp --api-key "$CONTEXT7_API_KEY"
      sed -i -e '/^\[mcp_servers\.serena\]$/a startup_timeout_sec = 30' -e '/^\[mcp_servers\.context7\]$/a startup_timeout_sec = 30' "$CODEX_HOME/config.toml"
build:
  stacks:
    - python
    - node
  instructions:
    root_run:
      - |-
        GH_VERSION=2.97.0 && \
          ARCH=$(dpkg --print-architecture) && \
          GH_FILE="gh_${GH_VERSION}_linux_${ARCH}.tar.gz" && \
          CHECKSUMS_FILE="gh_${GH_VERSION}_checksums.txt" && \
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${GH_FILE}" && \
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${CHECKSUMS_FILE}" && \
          grep " ${GH_FILE}\$" "${CHECKSUMS_FILE}" | sha256sum -c - && \
          tar -C /usr/local -xzf "${GH_FILE}" --strip-components=1 && \
          rm -f "${GH_FILE}" "${CHECKSUMS_FILE}"
      - |-
        PNPM_VERSION=11.24.0 && \
          ARCH=$(dpkg --print-architecture) && \
          case "$ARCH" in \
            amd64) PNPM_ARCH=x64 ;; \
            arm64) PNPM_ARCH=arm64 ;; \
            *) echo "Unsupported architecture for pnpm: $ARCH" >&2; exit 1 ;; \
          esac && \
          mkdir -p /usr/local/lib/pnpm && cd /tmp && \
          curl -fsSL "https://registry.npmjs.org/@pnpm/exe/-/exe-${PNPM_VERSION}.tgz" -o pnpm-exe.tgz && \
          curl -fsSL "https://registry.npmjs.org/@pnpm/linux-${PNPM_ARCH}/-/linux-${PNPM_ARCH}-${PNPM_VERSION}.tgz" -o pnpm-bin.tgz && \
          tar -xzf pnpm-exe.tgz -C /usr/local/lib/pnpm --strip-components=1 && \
          tar -xzf pnpm-bin.tgz -C /usr/local/lib/pnpm --strip-components=1 package/pnpm && \
          chmod +x /usr/local/lib/pnpm/pnpm && \
          ln -sf /usr/local/lib/pnpm/pnpm /usr/local/bin/pnpm && \
          rm -f pnpm-exe.tgz pnpm-bin.tgz && \
          pnpm --version
      - |-
        COSIGN_VERSION=v3.0.5 && \
          ARCH=$(dpkg --print-architecture) && \
          case "$ARCH" in \
            amd64) COSIGN_ARCH=amd64 ;; \
            arm64) COSIGN_ARCH=arm64 ;; \
            *) \
              echo "Unsupported architecture for Cosign: $ARCH" >&2; \
              exit 1; \
              ;; \
          esac && \
          COSIGN_FILE="cosign-linux-${COSIGN_ARCH}" && \
          CHECKSUMS_FILE="cosign_checksums.txt" && \
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${COSIGN_FILE}" && \
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${CHECKSUMS_FILE}" && \
          grep " ${COSIGN_FILE}\$" "${CHECKSUMS_FILE}" | sha256sum -c - && \
          install -m 755 "${COSIGN_FILE}" /usr/local/bin/cosign && \
          rm -f "${COSIGN_FILE}" "${CHECKSUMS_FILE}"
      - |-
        SYFT_VERSION=v1.42.3 && \
          ARCH=$(dpkg --print-architecture) && \
          case "$ARCH" in \
            amd64) SYFT_ARCH=amd64 ;; \
            arm64) SYFT_ARCH=arm64 ;; \
            armhf) SYFT_ARCH=armv7 ;; \
            *) \
              echo "Unsupported architecture for Syft: $ARCH" >&2; \
              exit 1; \
              ;; \
          esac && \
          SYFT_FILE="syft_${SYFT_VERSION#v}_linux_${SYFT_ARCH}.tar.gz" && \
          CHECKSUMS_FILE="syft_${SYFT_VERSION#v}_checksums.txt" && \
          curl -fsSLO "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_FILE}" && \
          curl -fsSLO "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${CHECKSUMS_FILE}" && \
          grep " ${SYFT_FILE}\$" "${CHECKSUMS_FILE}" | sha256sum -c - && \
          tar -C /usr/local/bin -xzf "${SYFT_FILE}" syft && \
          rm -f "${SYFT_FILE}" "${CHECKSUMS_FILE}"
    user_run:
      - uv tool install prek
  packages:
    - ripgrep
    - build-essential
    - jq
    - wget
    - curl
    - locales
    - locales-all
    - sqlite3
security:
  docker_socket: true
  firewall:
    add_domains:
      - pypi.org
      - files.pythonhosted.org
      - github.com
      - api.github.com
      - mcp.deepwiki.com
      - mcp.context7.com
      - context7.com
      - semgrep.dev
    rules:
      - dst: github.com
        proto: ssh
        port: "22"
        action: allow
      - action: allow
        dst: github.com
        insecure_skip_tls_verify: false
        path_default: deny
        path_rules:
          - action: allow
            path: ~/schmitthub/
          - action: allow
            path: /oraios/serena/
          - action: allow
            path: /anthropics/claude-code/
          - action: allow
            path: /gitleaks/gitleaks/
          - action: allow
            path: /pre-commit/pre-commit-hooks/
          - action: allow
            path: /astral-sh/ruff-pre-commit/
          - action: allow
            path: /astral-sh/python-build-standalone/releases/download/
            methods: [GET, HEAD]
        port: "443"
        proto: https
      - action: allow
        dst: api.github.com
        insecure_skip_tls_verify: false
        path_default: deny
        path_rules:
          - action: allow
            path: /schmitthub/
          - action: allow
            path: /repos/upstash/context7/
          - action: allow
            path: /anthropics/claude-code/
          - action: allow
            path: /repos/oraios/serena/commits/
        port: "443"
        proto: https
      - action: allow
        dst: raw.githubusercontent.com
        insecure_skip_tls_verify: false
        path_default: deny
        path_rules:
          - action: allow
            path: /schmitthub/
          - action: allow
            path: /oraios/serena/
          - action: allow
            path: /anthropics/claude-code/
          - action: allow
            path: /upstash/context7/master/plugins/claude/context7/skills/context7-mcp/
        port: "443"
        proto: https
  git_credentials:
    copy_git_config: true
    forward_gpg: true
    forward_https: true
    forward_ssh: true
