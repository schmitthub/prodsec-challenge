name: records-api CodeQL config

# Shared by every language in the codeql.yml matrix (python, actions), so
# nothing here may be python-specific in a way that breaks the actions
# analysis (e.g. a `paths:` allowlist of app/ would hide .github/workflows).

disable-default-queries: false

queries:
  # GitHub's suite (default set + security-extended + maintainability/
  # reliability queries). Swap for security-extended if the quality alerts
  # turn into noise for the team.
  - uses: security-and-quality
  # Project-specific queries. The pack skeleton is in place; enable this once
  # custom-queries/ contains a real query (next PR).
  # - uses: ./.github/codeql/custom-queries

paths-ignore:
  - tests
  - src           # uv scaffold stub, not the service
  - challenge     # exercise documents
  - .venv
  - .serena
  - .claude
  - .codex
