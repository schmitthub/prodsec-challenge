name: OSV image scan
description: >-
  Scan a docker-archive (output of `docker save`) with a pinned osv-scanner,
  upload all findings as SARIF to Code scanning, and do not fail on
  vulnerability findings.

inputs:
  archive:
    description: Path to the docker-archive tarball. Must be uncompressed; osv-scanner does not read .gz.
    required: true
  category:
    description: Code scanning category for the SARIF upload.
    required: true

runs:
  using: composite
  steps:
    - name: Install osv-scanner
      shell: bash
      # Version must match the google/osv-scanner rev in .pre-commit-config.yaml.
      run: |
        set -euo pipefail
        OSV_SCANNER_VERSION=2.5.1
        BASE_URL="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
        cd "${RUNNER_TEMP}"
        curl -sSfL "${BASE_URL}/osv-scanner_linux_amd64" -o osv-scanner_linux_amd64
        curl -sSfL "${BASE_URL}/osv-scanner_SHA256SUMS" -o osv-scanner_SHA256SUMS
        grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum --check
        chmod +x osv-scanner_linux_amd64
        sudo mv osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
        rm -f osv-scanner_SHA256SUMS
        osv-scanner --version

    - name: Scan the image archive
      id: scan
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
      # Exit 1 means findings and is non-blocking; anything else nonzero is a
      # scanner error. image.yml makes this entire action best-effort, so even
      # scanner or upload failures cannot block that workflow.
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/osv-image"
        SARIF="${OUT}/results.sarif"
        mkdir -p "${OUT}"

        rc=0
        osv-scanner scan image --archive \
          --format sarif --output-file "${SARIF}" \
          --verbosity error "${ARCHIVE}" || rc=$?
        if [ "${rc}" -gt 1 ]; then
          echo "::error::osv-scanner exited ${rc} (see https://google.github.io/osv-scanner/output/#return-codes)"
          exit "${rc}"
        fi
        echo "dir=${OUT}" >> "${GITHUB_OUTPUT}"

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        sarif_file: ${{ steps.scan.outputs.dir }}/results.sarif
        category: ${{ inputs.category }}
