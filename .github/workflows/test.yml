name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: local
      PROJECT_NAME: Records API
      SECRET_KEY: ci-only-not-a-secret
      SEED_PASSWORD: ci-only-not-a-secret
      LAB_VENDOR_API_KEY: ci-only-not-a-secret
      DEBUG_VENDOR_URL: https://vendor-api.example.test
      WEBHOOK_ALLOWED_HOSTS: vendor-api.example.test
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_DB: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip uv
      - run: uv sync --frozen
      - name: Mypy and Ruff
        run: bash scripts/lint.sh
      # Wait for the DB, apply migrations, seed the local fixture accounts.
      - run: uv run bash scripts/prestart.sh
      - run: uv run bash scripts/tests-start.sh
