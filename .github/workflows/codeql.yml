name: CodeQL

# Advanced setup (chosen over default setup so queries, paths and the custom
# query pack are controlled from this repo, not the Settings UI). Today it runs
# GitHub's own suites only; .github/codeql/ is the seam for the project's
# custom queries -- see codeql-config.yml and custom-queries/ for how a query
# gets wired in.
#
# Complements, not replaces, the Semgrep/gitleaks/image-scan jobs in security.yml:
# CodeQL is GitHub-hosted (Advanced Security); the rest run anywhere.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "36 2 * * 5" # weekly, catches new queries/advisories without a code change

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results
      actions: read          # workflow metadata for uploads in private repos
      packages: read         # CodeQL packs from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Suites, path filters and custom queries live in the config file so
          # they are reviewed like code. `queries:` here would override it.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
