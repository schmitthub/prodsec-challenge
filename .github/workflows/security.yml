name: security

# Reusable security checks, called by pr.yml (PRs) and main.yml (pushes to main).
#
# Gating policy (the part a busy product team has to live with):
#   - Semgrep: on PRs only findings *introduced by the PR* count (--baseline-commit),
#     and only ERROR severity fails the job. Everything (all severities, full
#     history on main) is uploaded to Code scanning as SARIF so WARNING/INFO show
#     up as annotations and alerts without blocking merges.
#   - Gitleaks: any new secret fails; accepted historical findings live in the
#     committed baseline (gitleaks-report.json), custom rules in .gitleaks.toml.
#   - Container image: built and pushed to a registry that exists only for the
#     job, scanned by digest. Fails only on Critical CVEs that already have a
#     fix (only-fixed) — the actionable subset.
#   - OSV (uv.lock, the resolved dependency set): report-only → Code scanning.
#     New vulnerable dependencies added by a PR are blocked by dependency-review.
#   - dependency-review (PRs): fails on new dependencies with High+ advisories.
#
# Tool versions here must match the pre-commit hook revs in .pre-commit-config.yaml.

on:
  workflow_call:
    inputs:
      run_dependency_review:
        required: false
        type: boolean
        default: false

# Reusable workflows take their permissions from the calling job; this block
# documents the superset the jobs below need.
permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    container:
      # Pin for reproducibility. When bumping: update this tag AND the
      # semgrep/pre-commit rev in .pre-commit-config.yaml.
      #   https://hub.docker.com/r/semgrep/semgrep/tags
      image: semgrep/semgrep:1.156.0@sha256:a3d49dc967b8534a6a76628e50c51cbfe33eb7195dc2feab1fdc0f100852c8ef
    timeout-minutes: 10
    # Dependabot PRs only touch lockfiles; SAST adds nothing and its token is limited.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semgrep scan
        # PRs: --baseline-commit limits findings to what the PR introduced.
        # main: full scan (no baseline). Both write SARIF (for Code scanning)
        # and JSON (for the severity gate) in one run; the run itself never fails.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASELINE=""
          if [ -n "$BASE_SHA" ]; then
            echo "Incremental scan against base $BASE_SHA"
            BASELINE="--baseline-commit $BASE_SHA"
          else
            echo "Full scan (no baseline)"
          fi
          # shellcheck disable=SC2086
          semgrep scan $BASELINE \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/github-actions \
            --config .semgrep/ \
            --metrics=off --disable-version-check \
            --sarif-output semgrep.sarif \
            --json-output semgrep.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Severity gate (ERROR blocks, WARNING/INFO annotate)
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json, sys
          results = json.load(open("semgrep.json"))["results"]
          # Semgrep uses ERROR/WARNING/INFO for code rules and CRITICAL/HIGH/MEDIUM/LOW
          # for newer rule packs; block on the top tier of each scale only.
          blocking = {"ERROR", "CRITICAL", "HIGH"}
          level = {"ERROR": "error", "CRITICAL": "error", "HIGH": "error",
                   "WARNING": "warning", "MEDIUM": "warning",
                   "INFO": "notice", "LOW": "notice"}
          for r in results:
              sev = r["extra"]["severity"]
              msg = r["extra"]["message"].strip().splitlines()[0]
              print(f'::{level.get(sev, "notice")} file={r["path"]},line={r["start"]["line"]},title={r["check_id"]}::{msg}')
          errors = [r for r in results if r["extra"]["severity"] in blocking]
          print(f"{len(results)} new finding(s); {len(errors)} blocking ({'/'.join(sorted(blocking))})")
          if errors:
              print("::error::High-severity Semgrep findings introduced by this PR block merge. "
                    "Lower severities are advisory (see Code scanning). Justify a true false "
                    "positive with an inline `# nosemgrep: <rule-id>` comment.")
              sys.exit(1)
          PY

  gitleaks:
    name: Gitleaks secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Raw CLI instead of gitleaks-action: the action does not expose
      # --baseline-path. Version must match the gitleaks rev in .pre-commit-config.yaml.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check
          sudo tar xzf "${ARCHIVE}" -C /usr/local/bin gitleaks
          rm -f "${ARCHIVE}" "${CHECKSUMS}"
          gitleaks version

      - name: Gitleaks (full history, baseline-aware)
        run: >-
          gitleaks git .
          --config .gitleaks.toml
          --baseline-path gitleaks-report.json
          --redact
          --report-format sarif --report-path results.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: gitleaks

  container:
    name: Container image scan
    # The Dockerfile is a local-dev convenience, not a shipped artifact, but its
    # base image and Python deps are exactly what a deployed image would carry.
    # Build it, push it to a registry that lives and dies with this job, and
    # scan it by digest -- the same flow a real registry would get.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      registry:
        image: registry@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33 # registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push to the job-local registry
        id: image
        run: |
          set -euo pipefail
          REF="localhost:5000/records-api:${GITHUB_SHA}"
          docker build -t "$REF" .
          docker push "$REF"
          DIGEST_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF")"
          echo "Pushed $DIGEST_REF"
          echo "ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"

      # In production this job would also emit BuildKit attestations (SBOM +
      # SLSA provenance) alongside the image in the real registry, so consumers
      # can verify what they pull. It needs the docker-container buildx driver
      # and a registry push, which this repo intentionally does not have:
      #   https://docs.docker.com/build/metadata/attestations/
      #
      # - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      #   with:
      #     driver-opts: network=host   # so the builder can reach localhost:5000
      # - name: Build with SBOM + provenance attestations
      #   run: |
      #     docker buildx build \
      #       --sbom=true \
      #       --provenance=mode=max \
      #       --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
      #       --push .
      # - name: Inspect attestations attached to the image
      #   run: |
      #     docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
      #       --format '{{ json .SBOM }}{{ json .Provenance }}'
      # Then sign the image digest with `cosign sign` (keyless) and verify with
      # `cosign verify --certificate-identity-regexp ... --certificate-oidc-issuer ...`.

      - name: Grype vulnerability scan (by digest, from the registry)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_REGISTRY_INSECURE_USE_HTTP: "true"   # job-local registry is plain HTTP on localhost
        with:
          image: registry:${{ steps.image.outputs.ref }}
          output-format: sarif
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Upload Grype SARIF
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: container

  osv:
    name: OSV dependency scan
    # Official reusable workflow, pointed at uv.lock (resolved, transitive); uploads SARIF.
    # Report-only here; dependency-review gates *new* vulnerable deps on PRs.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      scan-args: |-
        -L
        uv.lock
      fail-on-vuln: false

  dependency-review:
    name: Dependency review
    if: ${{ inputs.run_dependency_review }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
