# Authorization intent contracts. Provider implementations are reviewed code.
# Rules deliberately check recognizable symbols/structure, not business logic.
# Binding resources may name shared bases or domain markers. Provider result
# types (including TypedDict payloads) and public response schemas are independent.
# Compare selected policy symbols, never asset ancestry or response type identity.
rules:
  - id: authz-router-policy-required
    languages: [python]
    severity: ERROR
    message: Every PolicyRouter must name its protected_policy symbol.
    paths:
      include: ["app/**/*.py"]
    patterns:
      - pattern: app.authz.PolicyRouter(...)
      - pattern-not: app.authz.PolicyRouter(..., protected_policy=$POLICY, ...)

  - id: authz-route-router
    languages: [python]
    severity: ERROR
    message: Endpoint modules must use PolicyRouter; plain routers bypass the contract.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    pattern-either:
      - pattern: fastapi.APIRouter(...)
      - pattern: fastapi.FastAPI(...)

  - id: authz-route-binding-required
    languages: [python]
    severity: ERROR
    message: Endpoint data must enter through a named FromPolicy binding; its Python result type is independent of the protected asset and public response schema.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    patterns:
      - pattern: |
          @$R.$METHOD(...)
          def $F(...): ...
      - pattern-not: |
          @$R.$METHOD(...)
          def $F(..., $P: typing.Annotated[$T, ..., app.authz.FromPolicy(...), ...], ...): ...

  - id: authz-route-raw-dependency
    languages: [python]
    severity: ERROR
    message: Use FromPolicy in endpoints; arbitrary dependencies belong in reviewed providers.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    pattern-either:
      - pattern: fastapi.Depends(...)
      - pattern: fastapi.Security(...)

  - id: authz-route-import-boundary
    languages: [python]
    severity: ERROR
    message: Route imports are limited to models/schemas, policy symbols and result types, contract wiring, typing, and FastAPI. Move data access and service calls into reviewed providers.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    patterns:
      - pattern-either:
          - pattern: from $MODULE import $ITEM
          - pattern: import $MODULE
      - pattern-not: from typing import $ITEM
      - pattern-not: from __future__ import $ITEM
      - pattern-not: from fastapi import $ITEM
      - pattern-not: from fastapi.$SUB import $ITEM
      - pattern-not: from app.authz import $ITEM
      - pattern-not: from app.models import $ITEM
      - pattern-not: from app.api.policies import $ITEM
      - pattern-not: from app.api.policies.$SUB import $ITEM
      - pattern-not: import typing
      - pattern-not: import fastapi
      - pattern-not: import app.api.policies.$SUB

  - id: authz-route-provider-call
    languages: [python]
    severity: ERROR
    message: Do not call policy implementations from routes; consume their registered FromPolicy binding.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    pattern: app.api.policies.$MODULE.$FUNCTION(...)

  - id: authz-policy-definition-boundary
    languages: [python]
    severity: ERROR
    message: Define bindings and policies only in the reviewed policy layer.
    paths:
      include: ["app/**/*.py"]
      exclude: ["app/authz/**", "app/api/policies/**"]
    pattern-either:
      - pattern: app.authz.Binding(...)
      - pattern: |
          class $C(app.authz.Policy): ...
      - pattern: |
          class $C(app.api.policies.base.AuthenticatedPolicy): ...

  - id: authz-public-policy
    languages: [python]
    severity: ERROR
    message: Anonymous access requires a justified rule-specific suppression and code-owner review.
    paths:
      include: ["app/api/policies/**/*.py", "app/api/policies/*.py"]
    pattern: principal = app.authz.PUBLIC

  - id: authz-public-router
    languages: [python]
    severity: ERROR
    message: Applying this repository's anonymous policy requires an explicit reviewed exception.
    paths:
      include: ["app/**/*.py"]
    pattern-either:
      - pattern: app.authz.PolicyRouter(..., protected_policy=app.api.policies.login.LoginPolicy, ...)
      - pattern: app.authz.PolicyRouter(..., protected_policy=app.api.policies.health.HealthPolicy, ...)

  - id: authz-policy-override
    languages: [python]
    severity: ERROR
    message: An endpoint policy override requires a justified rule-specific suppression and review.
    paths:
      include: ["app/**/*.py"]
      exclude: ["app/authz/**"]
    pattern: app.authz.use_policy(...)

  - id: authz-binding-policy-mismatch
    languages: [python]
    severity: ERROR
    message: The binding must name the selected policy (the endpoint override when present, otherwise the router policy). Shared asset families or response schemas do not make policies interchangeable.
    paths:
      include: ["app/api/routes/**/*.py", "app/api/routes/*.py"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $ROUTER = app.authz.PolicyRouter(..., protected_policy=$POLICY, ...)
                  ...
              - pattern: |
                  @$ROUTER.$METHOD(...)
                  def $F(..., $P: typing.Annotated[$T, ..., app.authz.FromPolicy($OWNER.$BINDING), ...], ...): ...
              - pattern-not: |
                  @$ROUTER.$METHOD(..., dependencies=[..., app.authz.use_policy(...), ...], ...)
                  def $F(...): ...
          - pattern: |
              @$ROUTER.$METHOD(..., dependencies=[..., app.authz.use_policy($POLICY), ...], ...)
              def $F(..., $P: typing.Annotated[$T, ..., app.authz.FromPolicy($OWNER.$BINDING), ...], ...): ...
      # Compare the explicitly used policy names. Use one local import name for
      # each policy; this POC does not resolve multiple aliases to one object.
      - metavariable-comparison:
          metavariable: $OWNER
          comparison: str($OWNER) != str($POLICY)
      - focus-metavariable: $OWNER
