[project]
name = "prodsec-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Schmitt", email = "andrew@ajschmitt.io" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.0",
    "httpx==0.27.0",
    "pyjwt==2.12.0",
    "requests==2.31.0",
    "uvicorn==0.38.0",
]

[project.scripts]
prodsec-challenge = "prodsec_challenge:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
