[project]
name = "prodsec-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Schmitt", email = "andrew@ajschmitt.io" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx==0.27.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt==2.12.0",
    "requests==2.31.0",
    "sqlmodel>=0.0.42",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]
strict = true
# Historical generated revisions are immutable; check the live Alembic runner.
exclude = ["(^|/)(\\.venv|venv)/", "^app/alembic/versions/"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "mutable-override",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    "unimported-reveal",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["app/alembic/versions/"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused arguments in functions
    "T201", # print statements are not allowed
    "ANN", # require complete signatures; reject Any in function annotations
    "ASYNC", # blocking calls and invalid async patterns
    "BLE", # blanket exception handlers
    "DTZ", # timezone-aware datetime operations
    "FAST", # typed FastAPI dependencies and path parameters
    "ICN", # consistent import conventions
    "ISC", # accidental implicit string concatenation
    "LOG", # invalid logging calls
    "PIE", # unnecessary and error-prone constructs
    "PGH", # reject blanket ignores/noqa and invalid mock assertions
    "PLE", # pylint correctness errors
    "PLW", # suspicious operations and overwritten values
    "RET", # explicit, consistent return paths
    "RSE", # exception-raising mistakes
    "RUF", # mutable defaults, invalid annotations, stale suppressions
    "SIM", # unnecessarily complex control flow
    "SLOT", # __slots__ on immutable built-in subclasses
    "T10", # debugger statements
]
ignore = [
    "E501", # line wrapping is handled by Ruff's formatter
    "W191", # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
# CLI scripts: print is the output channel
"scripts/*" = ["T201"]
".github/scripts/*" = ["T201"]
".agents/**/scripts/*" = ["T201"]
# Deliberately incomplete/invalid signatures are scanner inputs, not runtime code.
".semgrep/*.py" = ["ANN"]
# StrEnum changes __str__; preserve existing persistence/public enum behavior.
"app/models.py" = ["UP042"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
log_cli = true


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
